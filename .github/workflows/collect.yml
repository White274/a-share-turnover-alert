name: A股定点量能采集

on:
  workflow_dispatch:

  schedule:
    # UTC 01:20 = 北京时间09:20
    # 每周一至周五只启动一次
    - cron: "20 1 * * 1-5"

permissions:
  contents: write

concurrency:
  group: a-share-turnover-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # =========================
      # 第一阶段：等待并采集10:00
      # =========================
      - name: Collect 10:00
        continue-on-error: true
        run: |
          python collector.py --target "10:00" --wait

      - name: Save 10:00 report
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports data

          if git diff --cached --quiet; then
            echo "10:00没有新报告需要提交"
          else
            git commit -m "更新10:00量能报告"
            git push
          fi

      # =========================
      # 第二阶段：继续等待并采集10:15
      # =========================
      - name: Collect 10:15
        if: always()
        continue-on-error: true
        run: |
          python collector.py --target "10:15" --wait

      - name: Save 10:15 report
        if: always()
        shell: bash
        run: |
          git add reports data

          if git diff --cached --quiet; then
            echo "10:15没有新报告需要提交"
          else
            git commit -m "更新10:15量能报告"
            git push
          fi
